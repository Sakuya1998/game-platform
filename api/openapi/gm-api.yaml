openapi: 3.1.0
info:
  title: Game Platform GM API
  version: 2.0.0
  description: |
    Operator API served by `gm-api`. Design baseline v2.0 (2026-11-23); see
    docs/game-platform-technical-design.md sections 6.2 and 7.

    Rules that apply to every operation:

    - The GM plane is separate from the player plane: its own login, MFA, tokens, signing keys
      and sessions. Player credentials are never accepted.
    - Authorization is deny-by-default and evaluated as administrator + permission code + game
      scope. `x-required-permission` names the permission code of each operation. A `game_id` in
      the path is accepted only after the administrator's scope for that game is confirmed.
    - Every mutation appends an audit record (operator, game, action, target, before/after,
      reason, request ID).
    - Mutations require `Idempotency-Key`. High-risk operations also require `reason`.
    - Batch operations (mass mail, batch rewards) create a background job and return its
      reference; they are never executed inside the request.
    - Responses use the envelope `{ code, message, data, request_id }`.
servers:
  - url: https://gm-api.example.com
security:
  - AdminBearer: []
tags:
  - name: Auth
  - name: Games
  - name: Players
  - name: Economy
  - name: Config
  - name: Mail
  - name: Activity
  - name: Announcement
  - name: Ranking
  - name: Admin
  - name: RBAC
  - name: Audit
  - name: Analytics
paths:
  /gm/v1/auth/login:
    post:
      tags: [Auth]
      operationId: adminLogin
      summary: Administrator login (first factor)
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: MFA challenge. Tokens are issued by `/auth/mfa/verify`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [mfa_required, challenge_token]
                        properties:
                          mfa_required: { type: boolean }
                          challenge_token: { type: string, description: 'Short-lived and single-use.' }
                          mfa_enrollment_required:
                            type: boolean
                            description: True when the administrator has not enrolled MFA yet.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /gm/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: verifyMfa
      summary: Verify the MFA code and issue an administrator session
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token: { type: string }
                code: { type: string, description: TOTP code or recovery code. }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /gm/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: adminRefresh
      summary: Rotate the administrator refresh token
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Rotated tokens
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /gm/v1/games:
    get:
      tags: [Games]
      operationId: listGames
      summary: List the games the administrator is scoped to
      x-required-permission: game.read
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Games
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Game' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Games]
      operationId: createGame
      summary: Create a game
      description: Requires platform scope.
      x-required-permission: game.manage
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, pattern: '^[a-z][a-z0-9_-]{1,62}$' }
                name: { type: string }
                platform_apps:
                  type: array
                  items:
                    type: object
                    required: [platform, app_id, credential_ref]
                    properties:
                      platform: { type: string, examples: [wechat_minigame] }
                      app_id: { type: string }
                      credential_ref:
                        type: string
                        description: Secret-manager reference. The AppSecret itself is never sent to this API.
      responses:
        '201':
          description: Game created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/players:
    get:
      tags: [Players]
      operationId: searchPlayers
      summary: Search players of a game
      x-required-permission: player.read
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RequestId'
        - name: player_id
          in: query
          schema: { type: string, format: uuid }
        - name: nickname
          in: query
          schema: { type: string }
        - name: openid
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, banned, deleted] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Player page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Player' }
                          next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gm/v1/games/{game_id}/players/{player_id}:
    get:
      tags: [Players]
      operationId: getPlayer
      summary: Get player detail
      x-required-permission: player.read
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Player detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlayerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gm/v1/games/{game_id}/players/{player_id}/ban:
    post:
      tags: [Players]
      operationId: banPlayer
      summary: Ban a player
      x-required-permission: player.ban
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
                ticket_id: { type: string }
                expires_at:
                  type: [string, 'null']
                  format: date-time
                  description: Null or absent means the ban lasts until it is lifted.
      responses:
        '200':
          description: Player banned; active sessions revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlayerBan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/players/{player_id}/unban:
    post:
      tags: [Players]
      operationId: unbanPlayer
      summary: Lift a player's active ban
      x-required-permission: player.unban
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
                ticket_id: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/players/{player_id}/save/restore:
    post:
      tags: [Players]
      operationId: restorePlayerSave
      summary: Restore a player's save from a snapshot
      description: |
        The current save is snapshotted first (`before_restore`), then replaced by the chosen
        snapshot with a new `save_version`. Wallets and items are not affected.
      x-required-permission: player.save.restore
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot_id, reason]
              properties:
                snapshot_id: { type: string, format: uuid }
                reason: { type: string, minLength: 3 }
                ticket_id: { type: string }
      responses:
        '200':
          description: Save restored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [save_version]
                        properties:
                          save_version: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/players/{player_id}/wallets:
    get:
      tags: [Economy]
      operationId: getPlayerWallets
      summary: Get a player's balances
      x-required-permission: economy.read
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Wallets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gm/v1/games/{game_id}/players/{player_id}/wallet-adjustments:
    post:
      tags: [Economy]
      operationId: adjustWallet
      summary: Manually credit or debit a player's wallet
      description: |
        Ledger-backed adjustment. The request carries a change amount, never a target balance.
        A positive `amount` credits and requires `economy.grant`; a negative `amount` debits and
        requires `economy.deduct`. The ledger row and the audit record are written in the same
        transaction. A debit that would make the balance negative is rejected.
      x-required-permission: economy.grant | economy.deduct
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, amount, reason]
              properties:
                currency: { type: string, examples: [gold] }
                amount:
                  type: integer
                  format: int64
                  not: { const: 0 }
                  description: Signed change in minor units.
                  examples: [1000]
                reason: { type: string, minLength: 3, examples: [customer compensation] }
                ticket_id: { type: string, examples: [SUPPORT-12345] }
      responses:
        '201':
          description: Adjustment committed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WalletTransaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Insufficient balance (`INSUFFICIENT_BALANCE`) or idempotency conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /gm/v1/games/{game_id}/transactions:
    get:
      tags: [Economy]
      operationId: listTransactions
      summary: Query the wallet ledger of a game
      x-required-permission: economy.read
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RequestId'
        - name: player_id
          in: query
          schema: { type: string, format: uuid }
        - name: currency
          in: query
          schema: { type: string }
        - name: transaction_type
          in: query
          schema: { type: string }
        - name: source_type
          in: query
          schema: { type: string }
        - name: source_id
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ledger page, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/WalletTransaction' }
                          next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gm/v1/games/{game_id}/configs:
    get:
      tags: [Config]
      operationId: listConfigs
      summary: List configs of a game with their active version
      description: Retained from contract 1.0; not listed in section 6.2 of the design document.
      x-required-permission: config.read
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Configs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Config' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Config]
      operationId: createConfig
      summary: Create a config with its first draft version
      x-required-permission: config.edit
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config_key, content]
              properties:
                config_key: { type: string }
                description: { type: string }
                json_schema: { type: object, description: JSON Schema used by validation. }
                content: { type: object }
      responses:
        '201':
          description: Config and draft version 1 created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Config' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/configs/{config_id}/versions:
    post:
      tags: [Config]
      operationId: createConfigVersion
      summary: Create a new draft version of a config
      description: |
        Retained from contract 1.0; not listed in section 6.2 of the design document. Versions are
        immutable once validated, so editing a config means creating a new version.
      x-required-permission: config.edit
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/ConfigId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: object }
                schema_version: { type: integer, minimum: 1, default: 1 }
      responses:
        '201':
          description: Draft version created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfigVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gm/v1/games/{game_id}/configs/{config_id}/validate:
    post:
      tags: [Config]
      operationId: validateConfigVersion
      summary: Validate a draft version against the config's JSON Schema and business rules
      x-required-permission: config.edit
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/ConfigId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Validation result. A failed validation is a 200 with `status = invalid`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfigVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gm/v1/games/{game_id}/configs/{config_id}/publish:
    post:
      tags: [Config]
      operationId: publishConfig
      summary: Publish a validated version
      description: Creates a new release. Only versions in `validated` status can be published.
      x-required-permission: config.publish
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/ConfigId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3 }
      responses:
        '200':
          description: Release created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfigRelease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Version is not validated (`CONFIG_VERSION_INVALID`) or idempotency conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /gm/v1/games/{game_id}/configs/{config_id}/rollback:
    post:
      tags: [Config]
      operationId: rollbackConfig
      summary: Roll back to an earlier published version
      description: Creates a new release of type `rollback` that points at the earlier version. No release is overwritten.
      x-required-permission: config.publish
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/ConfigId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version:
                  type: integer
                  minimum: 1
                  description: Previously published version to make active again.
                reason: { type: string, minLength: 3 }
      responses:
        '200':
          description: Rollback release created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfigRelease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/mails:
    post:
      tags: [Mail]
      operationId: createMail
      summary: Create a mail draft
      x-required-permission: mail.create
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, target_type]
              properties:
                title: { type: string }
                content: { type: string }
                target_type: { type: string, enum: [all_players, player_list, segment] }
                target_filter:
                  type: object
                  description: Player IDs for `player_list`, or segment conditions for `segment`.
                attachments:
                  type: array
                  items: { $ref: '#/components/schemas/Reward' }
                expires_at: { type: string, format: date-time }
      responses:
        '201':
          description: Mail draft created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Mail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gm/v1/games/{game_id}/mails/{mail_id}/send:
    post:
      tags: [Mail]
      operationId: sendMail
      summary: Send a mail
      description: |
        Creates a background job executed by `game-worker` and returns its reference. Delivery to
        each player is idempotent.
      x-required-permission: mail.send
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: mail_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
                ticket_id: { type: string }
                send_at:
                  type: string
                  format: date-time
                  description: Scheduled send time. Absent means as soon as possible.
      responses:
        '202':
          description: Delivery job accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RewardJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/activities:
    post:
      tags: [Activity]
      operationId: createActivity
      summary: Create an activity
      x-required-permission: activity.manage
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity_code, activity_type, name, start_at, end_at]
              properties:
                activity_code: { type: string }
                activity_type: { type: string }
                name: { type: string }
                config: { type: object, description: Tasks and reward table. }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
      responses:
        '201':
          description: Activity created in `draft` status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/announcements:
    post:
      tags: [Announcement]
      operationId: createAnnouncement
      summary: Create an announcement for a game
      x-required-permission: announcement.manage
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, start_at, end_at]
              properties:
                title: { type: string }
                content: { type: string }
                priority: { type: integer, default: 0 }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
      responses:
        '201':
          description: Announcement created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Announcement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gm/v1/games/{game_id}/leaderboards:
    get:
      tags: [Ranking]
      operationId: listLeaderboards
      summary: List leaderboards of a game
      x-required-permission: ranking.read
