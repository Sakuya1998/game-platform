        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Leaderboards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Leaderboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gm/v1/admins:
    get:
      tags: [Admin]
      operationId: listAdmins
      summary: List administrators
      x-required-permission: admin.read
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Administrator page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Admin' }
                          next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createAdmin
      summary: Create an administrator
      description: The new administrator sets a password and enrolls MFA at first login. No password is returned.
      x-required-permission: admin.manage
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                display_name: { type: string }
                role_assignments:
                  type: array
                  items: { $ref: '#/components/schemas/RoleAssignment' }
      responses:
        '201':
          description: Administrator created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Admin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/roles:
    get:
      tags: [RBAC]
      operationId: listRoles
      summary: List roles with their permission codes
      x-required-permission: admin.read
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gm/v1/roles/{role_id}/permissions:
    put:
      tags: [RBAC]
      operationId: setRolePermissions
      summary: Replace the permission set of a role
      x-required-permission: rbac.manage
      parameters:
        - name: role_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_codes, reason]
              properties:
                permission_codes:
                  type: array
                  items: { type: string }
                reason: { type: string, minLength: 3 }
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gm/v1/audit-logs:
    get:
      tags: [Audit]
      operationId: searchAuditLogs
      summary: Query GM audit logs
      description: Results are limited to the games the administrator is scoped to. Platform-level entries require platform scope.
      x-required-permission: audit.read
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: game_id
          in: query
          schema: { type: string, format: uuid }
        - name: admin_id
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: target_type
          in: query
          schema: { type: string }
        - name: target_id
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit log page, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AuditLog' }
                          next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gm/v1/analytics/overview:
    get:
      tags: [Analytics]
      operationId: getAnalyticsOverview
      summary: Operations overview for one game
      x-required-permission: analytics.read
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: game_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Daily metrics for the date range
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [game_id, days]
                        properties:
                          game_id: { type: string, format: uuid }
                          days:
                            type: array
                            items: { $ref: '#/components/schemas/DailyGameStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Administrator access token issued after MFA. Separate issuer, audience and signing keys from the player plane.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      schema: { type: string, maxLength: 64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    GameId:
      name: game_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlayerId:
      name: player_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConfigId:
      name: config_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired administrator credentials (`AUTH_UNAUTHORIZED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Missing permission code or game scope (`AUTH_FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found in this game (`RESOURCE_NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State or idempotency conflict (`IDEMPOTENCY_CONFLICT`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit exceeded (`RATE_LIMITED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Envelope:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string, examples: [OK] }
        message: { type: string, examples: [success] }
        data: {}
        request_id: { type: string }
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string, description: Stable machine-readable code. }
        message: { type: string }
        data: {}
        request_id: { type: string }
    AdminTokens:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Access token lifetime in seconds. }
        admin: { $ref: '#/components/schemas/Admin' }
    RoleAssignment:
      type: object
      required: [role_code, scope_type]
      properties:
        role_code: { type: string }
        scope_type: { type: string, enum: [platform, game] }
        game_id:
          type: [string, 'null']
          format: uuid
          description: Required when `scope_type` is `game`.
    Admin:
      type: object
      required: [admin_id, username, status]
      properties:
        admin_id: { type: string, format: uuid }
        username: { type: string }
        email: { type: [string, 'null'] }
        display_name: { type: [string, 'null'] }
        status: { type: string, enum: [active, disabled, locked] }
        mfa_enabled: { type: boolean }
        role_assignments:
          type: array
          items: { $ref: '#/components/schemas/RoleAssignment' }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Role:
      type: object
      required: [role_id, code, name, permission_codes]
      properties:
        role_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        is_system: { type: boolean }
        permission_codes:
          type: array
          items: { type: string }
    Game:
      type: object
      required: [game_id, code, name, status]
      properties:
        game_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled, archived] }
        platform_apps:
          type: array
          items:
            type: object
            required: [platform, app_id, status]
            properties:
              platform: { type: string }
              app_id: { type: string }
              status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
    Player:
      type: object
      required: [player_id, status, created_at]
      properties:
        player_id: { type: string, format: uuid }
        nickname: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'] }
        status: { type: string, enum: [active, banned, deleted] }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    PlayerDetail:
      allOf:
        - $ref: '#/components/schemas/Player'
        - type: object
          properties:
            identities:
              type: array
              items:
                type: object
                properties:
                  platform: { type: string }
                  app_id: { type: string }
                  openid: { type: string }
            active_ban:
              oneOf:
                - $ref: '#/components/schemas/PlayerBan'
                - type: 'null'
            save:
              type: [object, 'null']
              properties:
                schema_version: { type: integer }
                save_version: { type: integer, format: int64 }
                updated_at: { type: string, format: date-time }
            save_snapshots:
              type: array
              items:
                type: object
                properties:
                  snapshot_id: { type: string, format: uuid }
                  save_version: { type: integer, format: int64 }
                  snapshot_reason: { type: string }
                  created_at: { type: string, format: date-time }
    PlayerBan:
      type: object
      required: [ban_id, reason, starts_at]
      properties:
        ban_id: { type: string, format: uuid }
        reason: { type: string }
        ticket_id: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        banned_by: { type: [string, 'null'], format: uuid }
    Reward:
      type: object
      required: [type, id, quantity]
      properties:
        type: { type: string, enum: [currency, item] }
        id: { type: string, description: Currency code or item ID. }
        quantity: { type: integer, format: int64, minimum: 1 }
    Wallet:
      type: object
      required: [currency, balance]
      properties:
        currency: { type: string }
        balance: { type: integer, format: int64, minimum: 0 }
        updated_at: { type: string, format: date-time }
    WalletTransaction:
      type: object
      required: [id, player_id, currency, direction, amount, balance_after, transaction_type, source_type, source_id, created_at]
      properties:
        id: { type: string, format: uuid }
        player_id: { type: string, format: uuid }
        currency: { type: string }
        direction: { type: string, enum: [credit, debit] }
        amount: { type: integer, format: int64, minimum: 1 }
        balance_after: { type: integer, format: int64 }
        transaction_type: { type: string }
        source_type: { type: string }
        source_id: { type: string }
        actor_type: { type: string, enum: [player, admin, service, system] }
        actor_id: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Config:
      type: object
      required: [config_id, config_key, status]
      properties:
        config_id: { type: string, format: uuid }
        config_key: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [active, archived] }
        active_version: { type: [integer, 'null'] }
        latest_version: { type: [integer, 'null'] }
        updated_at: { type: string, format: date-time }
    ConfigVersion:
      type: object
      required: [version_id, config_id, version, status, checksum_sha256]
      properties:
        version_id: { type: string, format: uuid }
        config_id: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [draft, validated, invalid, published] }
        checksum_sha256: { type: string }
        validation_errors:
          type: [array, 'null']
          items: { type: object }
        created_by: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
    ConfigRelease:
      type: object
      required: [release_id, release_type, items, released_at]
      properties:
        release_id: { type: string, format: uuid }
        release_type: { type: string, enum: [publish, rollback] }
        rollback_of_release_id: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'] }
        items:
          type: array
          items:
            type: object
            required: [config_id, version]
            properties:
              config_id: { type: string, format: uuid }
              version: { type: integer }
        released_by: { type: [string, 'null'], format: uuid }
        released_at: { type: string, format: date-time }
    Mail:
      type: object
      required: [mail_id, title, target_type, status]
      properties:
        mail_id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        target_type: { type: string, enum: [all_players, player_list, segment] }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Reward' }
        status: { type: string, enum: [draft, scheduled, sending, sent, cancelled, failed] }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    RewardJob:
      type: object
      required: [job_id, job_type, status]
      properties:
        job_id: { type: string, format: uuid }
        job_type: { type: string, enum: [mail_delivery, batch_reward, compensation] }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        target_count: { type: integer, format: int64 }
        processed_count: { type: integer, format: int64 }
        failed_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    Activity:
      type: object
      required: [activity_id, activity_code, activity_type, status, start_at, end_at]
      properties:
        activity_id: { type: string, format: uuid }
        activity_code: { type: string }
        activity_type: { type: string }
        name: { type: string }
        config: { type: object }
        status: { type: string, enum: [draft, published, disabled, ended] }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
    Announcement:
      type: object
      required: [announcement_id, title, status, start_at, end_at]
      properties:
        announcement_id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        priority: { type: integer }
        status: { type: string, enum: [draft, published, archived] }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
    Leaderboard:
      type: object
      required: [board_id, board_code, period, status]
      properties:
        board_id: { type: string, format: uuid }
        board_code: { type: string }
        name: { type: string }
        period: { type: string, enum: [all_time, daily, weekly, monthly, season] }
        ranking_rule: { type: object }
        status: { type: string, enum: [active, disabled] }
    AuditLog:
      type: object
      required: [id, action, target_type, request_id, created_at]
      properties:
        id: { type: string, format: uuid }
