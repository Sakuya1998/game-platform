              properties:
                title: { type: string }
                content: { type: string }
                target_type: { type: string, enum: [all_players, player_list, segment] }
                target_filter:
                  type: object
                  description: 当目标类型为 `player_list` 时填写玩家 ID；为 `segment` 时填写分群条件。
                attachments:
                  type: array
                  items: { $ref: '#/components/schemas/Reward' }
                expires_at: { type: string, format: date-time }
      responses:
        '201':
          description: 邮件草稿已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Mail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gm/v1/games/{game_id}/mails/{mail_id}/send:
    post:
      tags: [Mail]
      operationId: sendMail
      summary: 发送邮件
      description: |
        创建由 `game-worker` 执行的后台任务并返回任务引用。邮件投递对每位玩家均保证幂等。
      x-required-permission: mail.send
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: mail_id
          in: path
          required: true
