openapi: 3.1.0
info:
  title: 游戏平台 GM API
  version: 2.0.0
  description: |
    由 `gm-api` 提供的运营端 API。设计基线 v2.0（2026-11-23），详见
    `docs/game-platform-technical-design.md` 第 6.2 和 7 节。

    所有操作均适用以下规则：

    - GM 平面与玩家平面相互隔离，使用独立的登录、MFA、令牌、签名密钥
      和会话。绝不接受玩家凭据。
    - 授权默认拒绝，并按管理员 + 权限代码 + 游戏范围进行评估。`x-required-permission` 指定
      每项操作所需的权限代码。只有确认管理员获准访问对应游戏后，才接受路径中的
      `game_id`。
    - 每次变更都追加一条审计记录（操作员、游戏、操作、目标、变更前后值、
      原因、请求 ID）。
    - 变更操作必须携带 `Idempotency-Key`。高风险操作还必须提供 `reason`。
    - 批量操作（群发邮件、批量奖励）会创建后台任务并返回任务引用；
      绝不在当前请求中执行。
    - 响应使用 `{ code, message, data, request_id }` 信封。
servers:
  - url: https://gm-api.example.com
security:
  - AdminBearer: []
tags:
  - name: Auth
  - name: 游戏列表
  - name: Players
  - name: Economy
  - name: Config
  - name: Mail
  - name: Activity
  - name: Announcement
  - name: Ranking
  - name: Admin
  - name: RBAC
  - name: Audit
  - name: Analytics
paths:
  /gm/v1/auth/login:
    post:
      tags: [Auth]
      operationId: adminLogin
      summary: 管理员登录（第一验证因素）
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: MFA 挑战。令牌由 `/auth/mfa/verify` 签发。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [mfa_required, challenge_token]
                        properties:
                          mfa_required: { type: boolean }
                          challenge_token: { type: string, description: '短时有效且仅可使用一次。' }
                          mfa_enrollment_required:
                            type: boolean
                            description: 管理员尚未注册 MFA 时为 true。
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /gm/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: verifyMfa
      summary: 验证 MFA 验证码并签发管理员会话
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token: { type: string }
                code: { type: string, description: TOTP 验证码或恢复码。 }
      responses:
        '200':
          description: 会话已签发
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /gm/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: adminRefresh
      summary: 轮换管理员 refresh token
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 令牌已轮换
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /gm/v1/games:
    get:
      tags: [游戏列表]
      operationId: list游戏列表
      summary: 列出管理员获授权的游戏
      x-required-permission: game.read
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 游戏列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Game' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [游戏列表]
      operationId: createGame
      summary: 创建游戏
      description: 需要平台级权限范围。
      x-required-permission: game.manage
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, pattern: '^[a-z][a-z0-9_-]{1,62}$' }
                name: { type: string }
                platform_apps:
                  type: array
                  items:
                    type: object
                    required: [platform, app_id, credential_ref]
                    properties:
                      platform: { type: string, examples: [wechat_minigame] }
                      app_id: { type: string }
                      credential_ref:
                        type: string
                        description: 密钥管理器引用。AppSecret 本身绝不会发送到此 API。
      responses:
        '201':
          description: 游戏已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/players:
    get:
      tags: [Players]
      operationId: searchPlayers
      summary: 搜索游戏中的玩家
      x-required-permission: player.read
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RequestId'
        - name: player_id
          in: query
          schema: { type: string, format: uuid }
        - name: nickname
          in: query
          schema: { type: string }
        - name: openid
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, banned, deleted] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 玩家分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Player' }
                          next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gm/v1/games/{game_id}/players/{player_id}:
    get:
      tags: [Players]
      operationId: getPlayer
      summary: 获取玩家详情
      x-required-permission: player.read
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 玩家详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlayerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gm/v1/games/{game_id}/players/{player_id}/ban:
    post:
      tags: [Players]
      operationId: banPlayer
      summary: 封禁玩家
      x-required-permission: player.ban
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
                ticket_id: { type: string }
                expires_at:
                  type: [string, 'null']
                  format: date-time
                  description: 为 null 或未提供时，封禁持续有效，直到被解除。
      responses:
        '200':
          description: 玩家已封禁；有效会话已撤销
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlayerBan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/players/{player_id}/unban:
    post:
      tags: [Players]
      operationId: unbanPlayer
      summary: 解除玩家当前封禁
      x-required-permission: player.unban
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
                ticket_id: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/players/{player_id}/save/restore:
    post:
      tags: [Players]
      operationId: restorePlayerSave
      summary: 从快照恢复玩家存档
      description: |
        先为当前存档创建快照（`before_restore`），再使用所选
        快照替换存档，并生成新的 `save_version`。钱包和道具不受影响。
      x-required-permission: player.save.restore
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot_id, reason]
              properties:
                snapshot_id: { type: string, format: uuid }
                reason: { type: string, minLength: 3 }
                ticket_id: { type: string }
      responses:
        '200':
          description: 存档已恢复
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [save_version]
                        properties:
                          save_version: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/players/{player_id}/wallets:
    get:
      tags: [Economy]
      operationId: getPlayer钱包
      summary: 获取玩家余额
      x-required-permission: economy.read
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 钱包
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gm/v1/games/{game_id}/players/{player_id}/wallet-adjustments:
    post:
      tags: [Economy]
      operationId: adjustWallet
      summary: 手动增加或扣除玩家钱包余额
      description: |
        调账必须写入流水。请求携带变更金额，绝不携带目标余额。
        正数 `amount` 表示增加余额，需要 `economy.grant` 权限；负数表示扣款，需要
        `economy.deduct` 权限。流水和审计记录在同一
        事务中写入。若扣款会导致余额为负，则拒绝操作。
      x-required-permission: economy.grant | economy.deduct
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, amount, reason]
              properties:
                currency: { type: string, examples: [gold] }
                amount:
                  type: integer
                  format: int64
                  not: { const: 0 }
                  description: 以最小单位表示的带符号变更金额。
                  examples: [1000]
                reason: { type: string, minLength: 3, examples: [customer compensation] }
                ticket_id: { type: string, examples: [SUPPORT-12345] }
      responses:
        '201':
          description: 调账已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WalletTransaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 余额不足（`INSUFFICIENT_BALANCE`）或发生幂等冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /gm/v1/games/{game_id}/transactions:
    get:
      tags: [Economy]
      operationId: listTransactions
      summary: 查询游戏的钱包流水
      x-required-permission: economy.read
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RequestId'
        - name: player_id
          in: query
          schema: { type: string, format: uuid }
        - name: currency
          in: query
          schema: { type: string }
        - name: transaction_type
          in: query
          schema: { type: string }
        - name: source_type
          in: query
          schema: { type: string }
        - name: source_id
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 流水分页结果，按时间倒序
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/WalletTransaction' }
                          next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gm/v1/games/{game_id}/configs:
    get:
      tags: [Config]
      operationId: list配置列表
      summary: 列出游戏配置及其生效版本
      description: 沿用契约 1.0；设计文档第 6.2 节未列出此操作。
      x-required-permission: config.read
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 配置列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Config' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Config]
      operationId: createConfig
      summary: 创建配置及其首个草稿版本
      x-required-permission: config.edit
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config_key, content]
              properties:
                config_key: { type: string }
                description: { type: string }
                json_schema: { type: object, description: 用于校验的 JSON Schema。 }
                content: { type: object }
      responses:
        '201':
          description: 配置及草稿版本 1 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Config' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gm/v1/games/{game_id}/configs/{config_id}/versions:
    post:
      tags: [Config]
      operationId: createConfigVersion
      summary: 为配置创建新草稿版本
      description: |
        沿用契约 1.0；设计文档第 6.2 节未列出此操作。 版本
        通过校验后不可变，因此编辑配置意味着创建新版本。
      x-required-permission: config.edit
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/ConfigId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: object }
                schema_version: { type: integer, minimum: 1, default: 1 }
      responses:
        '201':
          description: 草稿版本已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfigVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gm/v1/games/{game_id}/configs/{config_id}/validate:
    post:
      tags: [Config]
      operationId: validateConfigVersion
      summary: 根据配置的 JSON Schema 和业务规则校验草稿版本
      x-required-permission: config.edit
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/ConfigId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 校验结果。校验失败时仍返回 200，且 `status = invalid`。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfigVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gm/v1/games/{game_id}/configs/{config_id}/publish:
    post:
      tags: [Config]
      operationId: publishConfig
      summary: 发布已校验的版本
      description: 创建新的发布记录。只有状态为 `validated` 的版本才可发布。
      x-required-permission: config.publish
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/ConfigId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3 }
      responses:
        '200':
          description: 发布记录已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfigRelease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本尚未通过校验（`CONFIG_VERSION_INVALID`）或发生幂等冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /gm/v1/games/{game_id}/configs/{config_id}/rollback:
    post:
      tags: [Config]
      operationId: rollbackConfig
      summary: 回滚到较早发布的版本
      description: 创建一条指向较早版本、类型为 `rollback` 的新发布记录；不会覆盖任何发布记录。
      x-required-permission: config.publish
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/ConfigId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version:
                  type: integer
                  minimum: 1
                  description: 要重新启用的已发布版本。
                reason: { type: string, minLength: 3 }
      responses:
        '200':
          description: 回滚发布记录已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
