openapi: 3.1.0
info:
  title: 游戏平台内部 API
  version: 2.0.0
  description: |
    `internal-api` 的服务间调用契约。设计基线 v2.0（2026-11-23），详见
    `docs/game-platform-technical-design.md` 第 6.3 节及 `docs/adr/ADR-0008-internal-api-and-worker.md`。

    **状态：预留。V1 不部署 `internal-api`。** V1 中，`game-worker` 在进程内调用
    `gamecore`，不使用此 API。保留此契约是为了未来独立
    Worker 或其他可信系统需要 HTTP 访问时，无须修改 `gamecore` 即可启用。

    服务部署后，所有操作均适用以下规则：

    - 仅限私有网络访问；绝不通过公网入口路由。
    - 调用方必须是服务身份，并通过 HMAC AK/SK 签名或 mTLS 认证。绝不接受玩家或
      管理员令牌。
    - 签名请求必须携带时间戳和 nonce；拒绝过期或重放请求。
    - 按服务身份和游戏分别授权：只有服务拥有对应授权
      （`x-required-permission`）时，才接受请求中的 `game_id`。
    - 变更操作必须携带 `Idempotency-Key`。每次调用都写入服务审计日志。
    - 此 API 不是第二套 GM API：不提供任何运营工作流。
    - 第三方平台回调（微信、广告平台）不属于此 API，统一位于
      `/platform-callbacks/v1` 下，并使用各平台自有的验证机制。
    - 响应使用 `{ code, message, data, request_id }` 信封。
servers:
  - url: https://internal.example.com
    description: 仅限私有网络
security:
  - ServiceHmac: []
  - ServiceMtls: []
tags:
  - name: Jobs
  - name: Mail
  - name: Rewards
  - name: Analytics
  - name: Config
  - name: Maintenance
paths:
  /internal/v1/jobs/{job_id}/claim:
    post:
      tags: [Jobs]
      operationId: claimJob
      summary: 领取待处理任务并获取租约
      x-required-permission: job.execute
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: { type: string }
                lease_seconds: { type: integer, minimum: 10, maximum: 3600, default: 60 }
      responses:
        '200':
          description: 任务已领取
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobLease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/jobs/{job_id}/heartbeat:
    post:
      tags: [Jobs]
      operationId: heartbeatJob
      summary: 延长运行中任务的租约
      x-required-permission: job.execute
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_token]
              properties:
                lease_token: { type: string }
                lease_seconds: { type: integer, minimum: 10, maximum: 3600, default: 60 }
                progress: { type: object, description: 可选的进度计数器。 }
      responses:
        '200':
          description: 租约已延长
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobLease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/jobs/{job_id}/complete:
    post:
      tags: [Jobs]
      operationId: completeJob
      summary: 将任务标记为成功
      x-required-permission: job.execute
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_token]
              properties:
                lease_token: { type: string }
                result: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/jobs/{job_id}/fail:
    post:
      tags: [Jobs]
      operationId: failJob
      summary: 上报任务失败
      description: 服务端根据任务剩余重试次数，决定将状态设为 `retrying`（并执行退避）或 `failed`。
      x-required-permission: job.execute
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_token, error]
              properties:
                lease_token: { type: string }
                error: { type: string, maxLength: 2000 }
                retryable: { type: boolean, default: true }
      responses:
        '200':
          description: 失败已记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, enum: [retrying, failed] }
                          next_run_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/mail-deliveries/execute:
    post:
      tags: [Mail]
      operationId: executeMailDelivery
      summary: 向玩家投递一批邮件
      description: 每个 `(mail_id, player_id)` 的邮件投递均保证幂等。
      x-required-permission: mail.deliver
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game_id, mail_id, player_ids]
              properties:
                game_id: { type: string, format: uuid }
                mail_id: { type: string, format: uuid }
                reward_job_id: { type: string, format: uuid }
                player_ids:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: 批次已处理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BatchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/reward-jobs/execute:
    post:
      tags: [Rewards]
      operationId: executeRewardJob
      summary: 执行奖励任务的一批发放
      description: |
        奖励由奖励任务定义，而非由调用方提交。每项发放均经过
        经济服务，并通过流水唯一键保证每位玩家的操作幂等。
      x-required-permission: reward.execute
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game_id, reward_job_id, player_ids]
              properties:
                game_id: { type: string, format: uuid }
                reward_job_id: { type: string, format: uuid }
                player_ids:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: 批次已处理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BatchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/events/batch:
    post:
      tags: [Analytics]
      operationId: ingestEvents
      summary: 写入可信内部生产者上报的一批事件
      x-required-permission: event.write
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game_id, events]
              properties:
                game_id: { type: string, format: uuid }
                events:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [event_id, event_type, occurred_at]
                    properties:
                      event_id: { type: string, maxLength: 64 }
                      event_type: { type: string, maxLength: 64 }
                      player_id: { type: [string, 'null'], format: uuid }
                      occurred_at: { type: string, format: date-time }
                      payload: { type: object }
      responses:
        '202':
          description: 事件已接收；重复的 `event_id` 将被忽略
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accepted: { type: integer }
                          duplicates: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/v1/config-releases/notify:
    post:
      tags: [Config]
      operationId: notifyConfigRelease
      summary: 通知配置已发布，以便刷新缓存和 CDN
      x-required-permission: config.notify
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game_id, release_id]
              properties:
                game_id: { type: string, format: uuid }
                release_id: { type: string, format: uuid }
      responses:
        '202': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/maintenance/tasks:
    post:
      tags: [Maintenance]
      operationId: createMaintenanceTask
      summary: 将受控维护任务加入队列
      description: 仅接受允许列表中的任务类型，并以后台任务方式执行。
      x-required-permission: maintenance.run
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_type]
              properties:
                task_type:
                  type: string
                  enum:
                    - leaderboard_rebuild
                    - expired_data_cleanup
                    - save_snapshot
                    - config_cache_refresh
                    - stats_aggregation
                game_id:
                  type: [string, 'null']
                  format: uuid
                  description: 游戏范围的任务类型必填。
                params: { type: object }
      responses:
        '202':
          description: 任务已入队
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [job_id]
                        properties:
                          job_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    ServiceHmac:
      type: apiKey
      in: header
      name: X-Access-Key
      description: |
        服务凭据的 Access Key ID。使用匹配的密钥对请求签名
        （HMAC-SHA256），签名内容包括方法、路径、查询参数、时间戳、nonce 和请求体哈希；签名
        放在 `X-Signature` 中。服务首次
        部署时确定规范字符串格式。
    ServiceMtls:
      type: mutualTLS
      description: 客户端证书，其指纹须已登记在服务身份中。
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Timestamp:
      name: X-Timestamp
      in: header
      description: 请求时间，RFC 3339 UTC。HMAC 认证时必填；超出允许时钟偏差的请求会被拒绝。
      schema: { type: string, format: date-time }
    Nonce:
      name: X-Nonce
      in: header
      description: 每个请求唯一。HMAC 认证时必填；时钟偏差窗口内重复的 nonce 会被拒绝。
      schema: { type: string, minLength: 16, maxLength: 64 }
    Signature:
      name: X-Signature
      in: header
      description: 十六进制编码的 HMAC-SHA256 签名。HMAC 认证时必填。
      schema: { type: string }
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema: { type: string, maxLength: 64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Ok:
      description: 成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    BadRequest:
      description: 请求无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 凭据未知、签名错误、时间戳过期或 nonce 被重放（`AUTH_UNAUTHORIZED`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 服务身份缺少所需权限或游戏授权（`AUTH_FORBIDDEN`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在（`RESOURCE_NOT_FOUND`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 租约已丢失、任务已完成或发生幂等冲突（`IDEMPOTENCY_CONFLICT`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Envelope:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string, examples: [OK] }
        message: { type: string, examples: [success] }
        data: {}
        request_id: { type: string }
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string, description: 稳定、可供机器解析的代码。 }
        message: { type: string }
        data: {}
        request_id: { type: string }
    JobLease:
      type: object
      required: [job_id, job_type, lease_token, lease_expires_at]
      properties:
        job_id: { type: string, format: uuid }
        job_type: { type: string }
        game_id: { type: [string, 'null'], format: uuid }
        payload: { type: object }
        retry_count: { type: integer }
        lease_token: { type: string }
        lease_expires_at: { type: string, format: date-time }
    BatchResult:
      type: object
      required: [processed, skipped, failed]
      properties:
        processed: { type: integer }
        skipped: { type: integer, description: 此前已投递或已发放。 }
        failed: { type: integer }
        failures:
          type: array
          items:
            type: object
            properties:
              player_id: { type: string, format: uuid }
              code: { type: string }
