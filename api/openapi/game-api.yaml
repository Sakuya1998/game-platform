openapi: 3.1.0
info:
  title: 游戏平台游戏 API
  version: 2.0.0
  description: |
    由 `game-api` 提供的玩家端 API。设计基线 v2.0（2026-11-23），详见
    `docs/game-platform-technical-design.md` 第 6.1 节。

    所有操作均适用以下规则：

    - 玩家和游戏身份均从已验证的 access token 中获取。任何操作都不接受任意的
      `player_id` 或 `game_id`。登录时，服务端根据平台应用（`app_id`）解析游戏。

    - 响应使用 `{ code, message, data, request_id }` 信封。
    - 变更资产或创建资源的操作必须携带 `Idempotency-Key`。
    - 货币和道具数量均使用最小单位整数。时间采用 RFC 3339 UTC。
    - 客户端上报的结果（对局结果、广告完成情况）均不可信。奖励和
      余额始终由服务端决定。
servers:
  - url: https://api.example.com
security:
  - PlayerBearer: []
tags:
  - name: Auth
  - name: Player
  - name: Config
  - name: Save
  - name: Gameplay
  - name: Economy
  - name: Items
  - name: Ads
  - name: Mail
  - name: Activity
  - name: Ranking
  - name: Events
paths:
  /api/v1/auth/wechat/login:
    post:
      tags: [Auth]
      operationId: wechatLogin
      summary: 使用微信登录 code 换取平台令牌
      description: |
        服务端将 `app_id` 映射到游戏，使用该应用的密钥调用微信 `jscode2session`，
        并在游戏范围内查询或创建玩家。微信 `session_key` 绝不返回给客户端。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, code]
              properties:
                app_id:
                  type: string
                  description: 微信小游戏 AppID。仅用于选择已配置的平台应用。
                code:
                  type: string
                  minLength: 1
                  description: 由 `wx.login()` 返回的临时 code。
                device_id:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: 轮换 refresh token 并签发新的 access token
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 令牌已轮换；旧 refresh token 不再有效。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 撤销当前会话
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/player/profile:
    get:
      tags: [Player]
      operationId: getProfile
      summary: 获取当前玩家资料
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 玩家资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlayerProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Player]
      operationId: updateProfile
      summary: 更新当前玩家资料
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                nickname: { type: string, minLength: 1, maxLength: 32 }
                avatar_url: { type: string, format: uri, maxLength: 512 }
      responses:
        '200':
          description: 资料已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlayerProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/player/bootstrap:
    get:
      tags: [Player]
      operationId: getBootstrap
      summary: 一次调用获取客户端启动所需数据
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 启动初始化数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Bootstrap' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/configs:
    get:
      tags: [Config]
      operationId: listConfigs
      summary: 获取当前生效的配置版本索引
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 玩家所在游戏的配置索引
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ConfigIndexEntry' }
        '304': { description: 内容未变化 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/configs/{key}:
    get:
      tags: [Config]
      operationId: getConfig
      summary: 获取单项配置的当前生效版本
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 配置内容；若负载存储于对象存储，则返回 CDN URL
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Config' }
        '304': { description: 内容未变化 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/player/save:
    get:
      tags: [Save]
      operationId: getSave
      summary: 读取当前存档
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 当前存档。ETag 为带引号的 `save_version`。
          headers:
            ETag: { schema: { type: string, examples: ['"12"'] } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Save' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Save]
      operationId: updateSave
      summary: 使用乐观锁更新存档
      description: |
        仅当 `If-Match` 与当前 `save_version` 相同时写入才会成功；随后版本号递增。
        存档数据绝不修改钱包、道具或权益。
        玩家首次保存时发送 `If-Match: "0"`。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, examples: ['"12"'] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema_version, save_data]
              properties:
                schema_version: { type: integer, minimum: 1 }
                save_data: { type: object }
      responses:
        '200':
          description: 存档已更新
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Save' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '412':
          description: 存档已被其他会话修改（`SAVE_VERSION_CONFLICT`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { description: 存档负载超过配置的大小上限 }
  /api/v1/runs:
    post:
      tags: [Gameplay]
      operationId: createRun
      summary: 创建游戏对局
      description: 服务端生成对局 ID，并记录关卡、难度和规则版本。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level_id]
              properties:
                level_id: { type: string }
                difficulty: { type: string }
                mode: { type: string }
      responses:
        '201':
          description: 对局已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GameRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/runs/{run_id}/settlement:
    post:
      tags: [Gameplay]
      operationId: settleRun
      summary: 结算游戏对局
      description: |
        服务端校验对局所有权、状态、过期时间、消耗和奖励上限，然后在同一事务中写入
        结算、资产变更和流水记录。每场对局只能结算一次。
        客户端提交的结果摘要不可信；响应中包含服务端实际
        发放的奖励。
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: object
                  description: 客户端上报的结果摘要（例如分数、胜负标记、时长）。
                client_proof:
                  type: object
                  description: 供服务端校验或回放使用的可选材料。
      responses:
        '200':
          description: 结算结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Settlement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 对局已结算（`GAME_RUN_ALREADY_SETTLED`）、已过期或发生幂等冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/wallets:
    get:
      tags: [Economy]
      operationId: listWallets
      summary: 获取当前玩家余额
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 钱包余额
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/wallets/transactions:
    get:
      tags: [Economy]
      operationId: listWalletTransactions
      summary: 分页读取当前玩家的钱包流水
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: currency
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 流水分页结果，按时间倒序
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/WalletTransaction' }
                          next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/items:
    get:
      tags: [Items]
      operationId: listItems
      summary: 获取当前玩家道具背包
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 道具背包
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PlayerItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/ads/placements:
    get:
      tags: [Ads]
      operationId: listAdPlacements
      summary: 列出激励广告位和玩家今日剩余领取次数
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 广告位
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AdPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/ads/sessions:
    post:
      tags: [Ads]
      operationId: createAdSession
      summary: 展示激励广告前创建短时广告会话
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placement_code]
              properties:
                placement_code: { type: string }
      responses:
        '201':
          description: 广告会话已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已达到每日上限或广告位已停用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/ads/sessions/{session_id}/claim:
    post:
      tags: [Ads]
      operationId: claimAdReward
      summary: 领取广告会话奖励
      description: |
        服务端校验会话所有权、过期时间、广告位、每日限额及是否已领取，然后
        通过经济服务发放奖励。客户端的完成标记仅是证据，
        不能证明广告确实已播放。
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_completed]
              properties:
                client_completed:
                  type: boolean
                  description: 客户端在 `onClose` 中观察到的 `isEnded` 值。
      responses:
        '200':
          description: 领取结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RewardResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 会话已领取、已过期或已达到每日上限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/mails:
    get:
      tags: [Mail]
      operationId: listMails
      summary: 分页读取当前玩家邮件
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 邮件分页结果，按时间倒序
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PlayerMail' }
                          next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/mails/{mail_id}/claim:
    post:
      tags: [Mail]
      operationId: claimMail
      summary: 领取邮件附件
      parameters:
        - name: mail_id
          in: path
          required: true
          description: 玩家邮件条目 ID（`PlayerMail.id`）。
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 附件已发放
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RewardResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已领取、已过期或没有附件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/activities:
    get:
      tags: [Activity]
      operationId: listActivities
      summary: 列出当前玩家可见的活动
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 活动及玩家领取状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Activity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/activities/{activity_id}/claim:
    post:
      tags: [Activity]
      operationId: claimActivityReward
      summary: 领取活动的一项奖励
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reward_id]
              properties:
                reward_id:
                  type: string
                  description: 活动配置中的奖励条目。
      responses:
        '200':
          description: 奖励已发放
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RewardResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已领取、未满足条件或活动未启用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/leaderboards/{board_code}:
    get:
      tags: [Ranking]
      operationId: getLeaderboard
      summary: 获取排行榜前列条目及玩家自身名次
      parameters:
        - name: board_code
          in: path
          required: true
          schema: { type: string }
        - name: period_key
          in: query
          description: 读取周期。默认为该排行榜当前周期。
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 排行榜分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Leaderboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/events/batch:
    post:
      tags: [Events]
      operationId: uploadEvents
      summary: 批量上传客户端分析事件
      description: 事件通过 `event_id` 去重。事件仅用于统计上报，绝不修改资产。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/ClientEvent' }
      responses:
        '202':
          description: 事件已接收
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accepted: { type: integer }
                          duplicates: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    PlayerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 平台签发的玩家 access token，包含 `player_id` 和 `game_id`。使用与 GM 平面不同的密钥签名。
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      description: 客户端生成的请求 ID。若未提供则由服务端生成，并始终返回 `request_id`。
      schema: { type: string, maxLength: 64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Ok:
      description: 成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    BadRequest:
      description: 请求无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 凭据缺失、无效或已过期（`AUTH_UNAUTHORIZED`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 玩家已封禁（`AUTH_FORBIDDEN`）或游戏已停用（`GAME_DISABLED`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在（`RESOURCE_NOT_FOUND`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 状态或幂等冲突（`IDEMPOTENCY_CONFLICT`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 超出限流阈值（`RATE_LIMITED`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Envelope:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string, examples: [OK] }
        message: { type: string, examples: [success] }
        data: {}
        request_id: { type: string }
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: 稳定、可供机器解析的错误代码。以下为基线列表，后续可能扩展。
          examples:
            - AUTH_UNAUTHORIZED
            - AUTH_FORBIDDEN
            - PLAYER_NOT_FOUND
            - GAME_DISABLED
            - SAVE_VERSION_CONFLICT
            - GAME_RUN_ALREADY_SETTLED
            - INSUFFICIENT_BALANCE
            - IDEMPOTENCY_CONFLICT
            - CONFIG_VERSION_INVALID
            - RESOURCE_NOT_FOUND
            - RATE_LIMITED
            - INTERNAL_ERROR
        message: { type: string }
        data: {}
        request_id: { type: string }
    AuthTokens:
      type: object
      required: [access_token, refresh_token, expires_in, player]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: access token 的有效时长（秒）。 }
        player: { $ref: '#/components/schemas/PlayerProfile' }
    PlayerProfile:
      type: object
      required: [player_id, status]
      properties:
        player_id: { type: string, format: uuid }
        nickname: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'] }
        status: { type: string, enum: [active, banned] }
        created_at: { type: string, format: date-time }
    Bootstrap:
      type: object
      required: [player, server_time, wallets]
      properties:
        player: { $ref: '#/components/schemas/PlayerProfile' }
        server_time: { type: string, format: date-time }
        save_version: { type: integer, format: int64, description: 玩家尚无存档时为 0。 }
        wallets:
          type: array
          items: { $ref: '#/components/schemas/Wallet' }
        configs:
          type: array
          items: { $ref: '#/components/schemas/ConfigIndexEntry' }
        unread_mail_count: { type: integer }
    ConfigIndexEntry:
      type: object
      required: [key, version, checksum_sha256]
      properties:
        key: { type: string }
        version: { type: integer }
        checksum_sha256: { type: string }
        url: { type: [string, 'null'], format: uri, description: 负载存储于对象存储时的 CDN URL。 }
    Config:
      type: object
      required: [key, version, checksum_sha256]
      properties:
        key: { type: string }
        version: { type: integer }
        checksum_sha256: { type: string }
        content: { description: 内嵌负载。设置 `url` 时不返回此字段。 }
        url: { type: [string, 'null'], format: uri }
    Save:
      type: object
      required: [schema_version, save_version, save_data]
      properties:
        schema_version: { type: integer }
        save_version: { type: integer, format: int64 }
        save_data: { type: object }
        updated_at: { type: string, format: date-time }
    GameRun:
      type: object
      required: [run_id, level_id, status, expires_at]
      properties:
        run_id: { type: string, format: uuid }
        level_id: { type: string }
        difficulty: { type: [string, 'null'] }
        mode: { type: [string, 'null'] }
        rule_version: { type: [string, 'null'] }
        status: { type: string, enum: [started, settled, expired, rejected, abandoned] }
        started_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    Reward:
      type: object
      required: [type, id, quantity]
      properties:
        type: { type: string, enum: [currency, item] }
        id: { type: string, description: 货币代码或道具 ID。 }
        quantity: { type: integer, format: int64, minimum: 1 }
    Settlement:
      type: object
      required: [settlement_id, validation_status, rewards]
      properties:
        settlement_id: { type: string, format: uuid }
        validation_status: { type: string, enum: [accepted, rejected, review] }
        rewards:
          type: array
          items: { $ref: '#/components/schemas/Reward' }
        wallets:
          type: array
          description: 结算后的余额。
          items: { $ref: '#/components/schemas/Wallet' }
    RewardResult:
      type: object
      required: [granted, rewards]
      properties:
        granted: { type: boolean }
        rewards:
          type: array
          items: { $ref: '#/components/schemas/Reward' }
        wallets:
          type: array
          description: 发放后的余额。
          items: { $ref: '#/components/schemas/Wallet' }
    Wallet:
      type: object
      required: [currency, balance]
      properties:
        currency: { type: string }
        balance: { type: integer, format: int64, minimum: 0 }
    WalletTransaction:
      type: object
      required: [id, currency, direction, amount, balance_after, transaction_type, created_at]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string }
        direction: { type: string, enum: [credit, debit] }
        amount: { type: integer, format: int64, minimum: 1 }
        balance_after: { type: integer, format: int64 }
        transaction_type: { type: string }
        created_at: { type: string, format: date-time }
    PlayerItem:
      type: object
      required: [item_id, quantity]
      properties:
        item_id: { type: string }
        item_type: { type: string }
        quantity: { type: integer, format: int64, minimum: 0 }
    AdPlacement:
      type: object
      required: [placement_code, daily_limit, remaining_today]
      properties:
        placement_code: { type: string }
        ad_unit_id: { type: [string, 'null'] }
        daily_limit: { type: integer }
        remaining_today: { type: integer }
        rewards:
          type: array
          items: { $ref: '#/components/schemas/Reward' }
    AdSession:
      type: object
      required: [session_id, placement_code, expires_at]
      properties:
        session_id: { type: string, format: uuid }
        placement_code: { type: string }
        expires_at: { type: string, format: date-time }
    PlayerMail:
      type: object
      required: [id, title, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Reward' }
        read_at: { type: [string, 'null'], format: date-time }
        claimed_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Activity:
      type: object
      required: [activity_id, activity_code, activity_type, start_at, end_at]
      properties:
        activity_id: { type: string, format: uuid }
        activity_code: { type: string }
        activity_type: { type: string }
        name: { type: string }
        config: { type: object, description: 活动配置中对客户端可见的部分。 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        claimed_reward_ids:
          type: array
          items: { type: string }
    LeaderboardEntry:
      type: object
      required: [rank, player_id, score]
      properties:
        rank: { type: integer, minimum: 1 }
        player_id: { type: string, format: uuid }
        nickname: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'] }
        score: { type: integer, format: int64 }
    Leaderboard:
      type: object
      required: [board_code, period_key, entries]
      properties:
        board_code: { type: string }
        period_key: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/LeaderboardEntry' }
        self:
          description: 当前玩家的条目；若玩家没有分数则为 null。
          oneOf:
            - $ref: '#/components/schemas/LeaderboardEntry'
            - type: 'null'
    ClientEvent:
      type: object
      required: [event_id, event_type, occurred_at]
      properties:
        event_id: { type: string, maxLength: 64 }
        event_type: { type: string, maxLength: 64 }
        occurred_at: { type: string, format: date-time }
        payload: { type: object }
